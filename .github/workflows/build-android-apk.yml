name: Build Android APK

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "android-apk"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Update root APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MedidorSenal-UTN.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedidorSenal-UTN-apk
          path: MedidorSenal-UTN.apk

      - name: Commit and push updated APK
        id: commit_apk
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MedidorSenal-UTN.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore(android): actualizar MedidorSenal-UTN.apk [skip ci]"
            git pull --rebase origin main
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger GitHub Pages deploy
        if: steps.commit_apk.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main
